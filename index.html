<style>
  :root{
    --ink:#0B2338;
    --navy:#0B3F67;
    --navy-2:#0F4E7D;
    --paper:#EEF3F8;
    --panel:#FFFFFF;
    --line:#D7E2EC;
    --line-soft:#E7EEF4;
    --gold:#C9A93A;
    --gold-dark:#A9872A;
    --text:#152436;
    --muted:#5C7086;
    --muted-2:#8CA0B3;
    --success:#2E7D5B;
    --success-bg:#E4F2EA;
    --amber:#B07822;
    --amber-bg:#FBF1DC;
    --danger:#B14444;
    --danger-bg:#FBEAEA;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{font-family:'Fraunces',serif;}
  ::selection{background:#E9DAB8;}

  /* ---------- layout ---------- */
  #app{display:flex; min-height:100vh;}
  .sidebar{
    width:230px; flex-shrink:0; background:var(--navy);
    color:#EDE9DC; padding:24px 16px; display:flex; flex-direction:column; gap:4px;
    position:sticky; top:0; height:100vh;
  }
  .brand{padding:4px 8px 20px 8px; border-bottom:1px solid rgba(255,255,255,0.14); margin-bottom:14px; display:flex; align-items:center; gap:11px;}
  .brand img{width:42px; height:42px; border-radius:9px; object-fit:cover; flex-shrink:0; box-shadow:0 2px 8px rgba(0,0,0,0.25);}
  .brand .title{font-family:'Fraunces',serif; font-size:16.5px; font-weight:600; line-height:1.25; color:#fff;}
  .brand .sub{font-size:11px; color:#AEC6DC; margin-top:3px; letter-spacing:.02em;}
  .navitem{
    display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px;
    color:#C9CEE8; cursor:pointer; font-size:14px; font-weight:500; transition:background .15s ease, color .15s ease;
    border:1px solid transparent;
  }
  .navitem svg{width:16px; height:16px; opacity:.85; flex-shrink:0;}
  .navitem:hover{background:rgba(255,255,255,0.06); color:#fff;}
  .navitem.active{background:var(--navy-2); color:#fff; border-color:rgba(201,169,58,0.45);}
  .navitem.active svg{opacity:1;}
  .sidebar-foot{margin-top:auto; padding:10px 8px; font-size:11px; color:#8FA8BF; border-top:1px solid rgba(255,255,255,0.1); padding-top:14px;}

  .main{flex:1; min-width:0; display:flex; flex-direction:column;}
  .topbar{
    padding:20px 32px; display:flex; align-items:center; justify-content:space-between; gap:16px;
    border-bottom:1px solid var(--line); background:var(--paper); position:sticky; top:0; z-index:5;
  }
  .topbar h1{font-size:22px; margin:0; font-weight:600;}
  .topbar .meta{font-size:12.5px; color:var(--muted); margin-top:3px;}
  .content{padding:28px 32px 60px 32px; flex:1;}

  .btn{
    border:none; cursor:pointer; font-family:'Inter',sans-serif; font-weight:600; font-size:13.5px;
    padding:10px 16px; border-radius:8px; display:inline-flex; align-items:center; gap:7px; transition:transform .05s ease, background .15s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--gold); color:#fff;}
  .btn-primary:hover{background:var(--gold-dark);}
  .btn-ghost{background:transparent; color:var(--navy); border:1px solid var(--line);}
  .btn-ghost:hover{background:#fff; border-color:var(--gold);}
  .btn-danger{background:var(--danger-bg); color:var(--danger);}
  .btn-danger:hover{background:#f3d9d9;}
  .btn-sm{padding:6px 10px; font-size:12.5px; border-radius:7px;}

  /* ---------- dashboard cards ---------- */
  .grid-stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; margin-bottom:26px;}
  .stat-card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:18px 18px 16px 18px;
    position:relative; overflow:hidden;
  }
  .stat-card::before{content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--gold);}
  .stat-card .label{font-size:12px; color:var(--muted); font-weight:500;}
  .stat-card .value{font-family:'Fraunces',serif; font-size:26px; margin-top:6px; font-weight:600;}
  .stat-card.accent-success::before{background:var(--success);}
  .stat-card.accent-danger::before{background:var(--danger);}
  .stat-card.accent-navy::before{background:var(--navy);}

  .panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:20px; margin-bottom:20px; overflow-x:auto;}
  .panel-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:10px; flex-wrap:wrap;}
  .panel-head h3{margin:0; font-size:15.5px; font-weight:600;}

  /* ---------- table ---------- */
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  thead th{
    text-align:left; font-size:11.5px; color:var(--muted); font-weight:600; letter-spacing:.01em;
    padding:8px 10px; border-bottom:1px solid var(--line);
  }
  tbody td{padding:11px 10px; border-bottom:1px solid var(--line-soft); vertical-align:middle;}
  tbody tr:hover{background:#FBF9F3;}
  tbody tr:last-child td{border-bottom:none;}
  .cell-strong{font-weight:600;}
  .cell-muted{color:var(--muted); font-size:12.5px;}
  .row-actions{display:flex; gap:6px;}
  .empty-row td{text-align:center; color:var(--muted-2); padding:32px 10px; font-size:13.5px;}

  .badge{display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:99px; font-size:11.5px; font-weight:600;}
  .badge-paid{background:var(--success-bg); color:var(--success);}
  .badge-partial{background:var(--amber-bg); color:var(--amber);}
  .badge-due{background:var(--danger-bg); color:var(--danger);}
  .badge-dot{width:6px; height:6px; border-radius:99px; background:currentColor;}
  .tag{display:inline-block; padding:2px 9px; border-radius:6px; font-size:11.5px; font-weight:600; background:#EFEBDD; color:#5C5544;}

  /* ---------- filters / search ---------- */
  .filters-row{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  .input, select.input{
    border:1px solid var(--line); border-radius:8px; padding:9px 12px; font-size:13.5px; font-family:'Inter',sans-serif;
    background:#fff; color:var(--text); outline:none;
  }
  .input:focus, select.input:focus{border-color:var(--gold);}
  .search-wrap{position:relative; min-width:230px; flex:1;}
  .search-wrap input{width:100%; padding-left:34px;}
  .search-wrap svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--muted-2);}

  /* ---------- forms/modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(20,26,43,0.45); display:flex; align-items:flex-start; justify-content:center;
    padding:40px 16px; overflow-y:auto; z-index:50;
  }
  .modal{background:#fff; border-radius:14px; width:100%; max-width:640px; padding:26px 28px 28px 28px; box-shadow:0 20px 60px rgba(20,26,43,0.25);}
  .modal.wide{max-width:760px;}
  .modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
  .modal-head h2{margin:0; font-size:19px; font-weight:600;}
  .modal-close{cursor:pointer; background:none; border:none; color:var(--muted); font-size:20px; line-height:1;}
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .field{display:flex; flex-direction:column; gap:5px;}
  .field.full{grid-column:1 / -1;}
  .field label{font-size:12.5px; font-weight:600; color:var(--muted);}
  .field .err{font-size:11.5px; color:var(--danger); min-height:14px;}
  .form-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:20px; padding-top:16px; border-top:1px solid var(--line);}

  /* ---------- profile ---------- */
  .profile-top{display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; margin-bottom:6px;}
  .profile-name{font-family:'Fraunces',serif; font-size:22px; font-weight:600;}
  .profile-id{color:var(--muted); font-size:13px; margin-top:2px;}
  .kv-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:16px; margin:18px 0;}
  .kv .k{font-size:11.5px; color:var(--muted); font-weight:600;}
  .kv .v{font-size:14px; margin-top:3px; font-weight:500;}
  .fee-bar{height:8px; border-radius:99px; background:var(--line-soft); overflow:hidden; margin-top:6px;}
  .fee-bar-fill{height:100%; background:var(--success);}

  .toast{
    position:fixed; bottom:22px; right:22px; background:var(--ink); color:#fff; padding:12px 18px; border-radius:9px;
    font-size:13.5px; z-index:100; box-shadow:0 8px 24px rgba(0,0,0,0.25); opacity:0; transform:translateY(8px);
    transition:opacity .2s ease, transform .2s ease;
  }
  .toast.show{opacity:1; transform:translateY(0);}

  .hint{font-size:12px; color:var(--muted-2);}
  .divider{height:1px; background:var(--line); margin:16px 0;}

  @media (max-width: 880px){
    .sidebar{position:fixed; z-index:40; transform:translateX(-100%); transition:transform .2s ease; box-shadow:0 0 40px rgba(0,0,0,.3);}
    .sidebar.open{transform:translateX(0);}
    .topbar{padding:16px 18px;}
    .content{padding:18px 18px 50px 18px;}
    .form-grid{grid-template-columns:1fr;}
    .menu-btn{display:inline-flex !important;}
  }
  .menu-btn{display:none; background:none; border:1px solid var(--line); border-radius:8px; padding:8px 10px; cursor:pointer;}

  /* ---------- lock screen ---------- */
  #lockScreen{
    position:fixed; inset:0; background:linear-gradient(160deg, var(--navy), var(--ink));
    display:flex; align-items:center; justify-content:center; z-index:200; padding:20px;
  }
  .lock-card{
    background:#fff; border-radius:14px; padding:32px 30px; width:100%; max-width:360px;
    box-shadow:0 24px 60px rgba(0,0,0,0.35); text-align:center;
  }
  .lock-card img{width:64px; height:64px; border-radius:12px; object-fit:cover; margin-bottom:14px;}
  .lock-card h2{margin:0 0 4px 0; font-size:18px; font-weight:600;}
  .lock-card p{margin:0 0 18px 0; font-size:12.5px; color:var(--muted);}
  .lock-card input{width:100%; text-align:center; letter-spacing:.08em; margin-bottom:10px;}
  .lock-card .lock-err{font-size:12px; color:var(--danger); min-height:16px; margin-bottom:6px;}
  .lock-card button{width:100%; justify-content:center;}

  @media print{
    .sidebar, .topbar .btn, .no-print, .menu-btn{display:none !important;}
    body{background:#fff;}
    .panel{border:none; box-shadow:none;}
  }

/* ---- Make this installable as an app (PWA): manifest + offline caching ---- */
(function setupInstallableApp(){
  try{
    const manifest = {
      name: "Nirala English Wala & Arts — Admissions & Fee Ledger",
      short_name: "Nirala Ledger",
      start_url: ".",
      display: "standalone",
      background_color: "#EEF3F8",
      theme_color: "#0B3F67",
      icons: [
        { src: LOGO_SRC, sizes: "300x296", type: "image/jpeg", purpose: "any maskable" }
      ]
    };
    const blob = new Blob([JSON.stringify(manifest)], {type: "application/manifest+json"});
    const url = URL.createObjectURL(blob);
    const link = document.createElement("link");
    link.rel = "manifest";
    link.href = url;
    document.head.appendChild(link);
  }catch(e){ /* manifest not supported in this context — app still works normally */ }

  try{
    if("serviceWorker" in navigator){
      const swCode = `
        self.addEventListener('install', e => self.skipWaiting());
        self.addEventListener('activate', e => self.clients.claim());
        self.addEventListener('fetch', e => {
          e.respondWith(fetch(e.request).catch(()=>caches.match(e.request)));
        });
      `;
      const swBlob = new Blob([swCode], {type: "application/javascript"});
      const swUrl = URL.createObjectURL(swBlob);
      navigator.serviceWorker.register(swUrl).catch(()=>{ /* offline caching unavailable — fine, app still works online */ });
    }
  }catch(e){ /* ignore */ }
})();

let state = {
  students: [],
  settings: { instituteName: "Nirala English Wala & Arts" },
  loaded: false,
  authChecked: false,
  view: "dashboard",
  search: "",
  filterClass: "",
  filterStream: "",
  filterYear: "",
  reportTab: "classwise",
  sidebarOpen: false,
};

function uid(){ return Math.random().toString(36).slice(2,9); }

function computeDerived(s){
  const paid = (s.payments||[]).reduce((a,p)=>a+Number(p.amount||0),0);
  const due = Math.max(0, Number(s.totalFee||0) - paid);
  let status = "due";
  if (paid <= 0) status = "due";
  else if (due <= 0) status = "paid";
  else status = "partial";
  const lastPayment = (s.payments||[]).slice().sort((a,b)=> new Date(b.date)-new Date(a.date))[0];
  return { paid, due, status, lastPaymentDate: lastPayment ? lastPayment.date : null };
}

function nextAdmissionId(){
  const year = new Date().getFullYear();
  const existing = new Set(state.students.map(s=>s.id));
  let n = state.students.length + 1;
  let id;
  do {
    id = `ADM-${year}-${String(n).padStart(4,"0")}`;
    n++;
  } while(existing.has(id));
  return id;
}

function attachStudentsListener(){
  if(unsubscribeStudents) return;
  unsubscribeStudents = db.collection("students").onSnapshot((snap)=>{
    state.students = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    state.loaded = true;
    render();
  }, (err)=>{
    state.loaded = true;
    showToast("Sync error: " + err.message);
    render();
  });
}

async function createStudentDoc(id, data){
  try{
    await db.collection("students").doc(id).set(data);
  }catch(e){ showToast("Could not save: " + e.message); }
}
async function updateStudentDoc(id, data){
  try{
    await db.collection("students").doc(id).update(data);
  }catch(e){ showToast("Could not save: " + e.message); }
}
async function deleteStudentDoc(id){
  try{
    await db.collection("students").doc(id).delete();
  }catch(e){ showToast("Could not delete: " + e.message); }
}

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove("show"), 2600);
}

/* =========================================================
   HELPERS
   ========================================================= */
function fmtMoney(n){
  n = Number(n||0);
  return "₹" + n.toLocaleString("en-IN");
}
function fmtDate(d){
  if(!d) return "—";
  const dt = new Date(d);
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"});
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function isToday(d){ return d === todayStr(); }
function escapeHtml(str){
  return String(str??"").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function validMobile(m){ return /^[0-9]{10}$/.test(String(m||"").trim()); }

/* WhatsApp fee reminders — sent from whichever phone/number opens the link.
   Institute's designated numbers for this task: +91 9279701355, +91 8709322284 */
function buildReminderLink(s){
  const d = computeDerived(s);
  const guardianLabel = s.fatherName || s.guardianName || s.motherName || "Guardian";
  const msg = `Dear ${guardianLabel}, a fee payment of ${fmtMoney(d.due)} is due for ${s.name} (Class ${s.class} - ${streamsLabel(s)}) at ${state.settings.instituteName}. Kindly clear the due amount at the earliest. Thank you.`;
  const phone = String(s.guardianWhatsapp || s.guardianMobile || "").replace(/\D/g,"");
  return `https://wa.me/91${phone}?text=${encodeURIComponent(msg)}`;
}

function getStreams(s){
  if(Array.isArray(s.streams) && s.streams.length) return s.streams;
  if(s.stream) return [s.stream];
  return [];
}
function streamsLabel(s){
  const arr = getStreams(s);
  return arr.length ? arr.join(" + ") : "—";
}

function admissionYear(s){
  return s.admissionDate ? String(s.admissionDate).slice(0,4) : "";
}

function availableYears(){
  const years = new Set(state.students.map(admissionYear).filter(Boolean));
  return Array.from(years).sort((a,b)=> b.localeCompare(a));
}

function filteredStudents(){
  let list = state.students.slice();
  if(state.filterClass) list = list.filter(s=>s.class===state.filterClass);
  if(state.filterStream) list = list.filter(s=>getStreams(s).includes(state.filterStream));
  if(state.filterYear) list = list.filter(s=>admissionYear(s)===state.filterYear);
  if(state.search.trim()){
    const q = state.search.trim().toLowerCase();
    list = list.filter(s =>
      s.name.toLowerCase().includes(q) ||
      String(s.mobile).includes(q) ||
      s.id.toLowerCase().includes(q) ||
      String(s.rollNumber||"").toLowerCase().includes(q)
    );
  }
  return list.sort((a,b)=> new Date(b.admissionDate) - new Date(a.admissionDate));
}

/* =========================================================
   RENDER: SHELL
   ========================================================= */
function navItem(id, icon, label){
  const active = state.view === id ? "active" : "";
  return `<div class="navitem ${active}" data-nav="${id}">${icon}<span>${label}</span></div>`;
}

function render(){
  const app = document.getElementById("app");
  if(!state.loaded){
    app.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100vh;width:100%;color:var(--muted);font-family:'Inter',sans-serif;">Loading records…</div>`;
    return;
  }
  const titleMap = {
    dashboard:"Dashboard",
    students:"Student Management",
    admissions:"Admission Management",
    fees:"Fee Management",
    reports:"Reports",
  };
  app.innerHTML = `
    <div class="sidebar ${state.sidebarOpen?'open':''}" id="sidebar">
      <div class="brand">
        <img src="${LOGO_SRC}" alt="Institute logo" />
        <div>
          <div class="title">${escapeHtml(state.settings.instituteName || "Nirala English Wala & Arts")}</div>
          <div class="sub">Admission &amp; Fee Management</div>
        </div>
      </div>
      ${navItem("dashboard", ICONS.dashboard, "Dashboard")}
      ${navItem("students", ICONS.students, "Students")}
      ${navItem("admissions", ICONS.admission, "Admissions")}
      ${navItem("fees", ICONS.fees, "Fee Management")}
      ${navItem("reports", ICONS.reports, "Reports")}
      <div class="sidebar-foot">
        Classes tracked: 11 &amp; 12<br/>Streams: English &amp; Arts
        <div style="margin-top:10px; opacity:.8;">Ledger version ${APP_VERSION}</div>
        <div style="margin-top:10px;"><a href="#" id="signOutLink" style="color:#AEC6DC; text-decoration:underline;">Sign out</a></div>
      </div>
    </div>
    <div class="main">
      <div class="topbar">
        <div style="display:flex; align-items:center; gap:12px;">
          <button class="menu-btn" id="menuBtn">${ICONS.menu}</button>
          <div>
            <h1>${titleMap[state.view]}</h1>
            <div class="meta">${escapeHtml(state.settings.instituteName || "Nirala English Wala & Arts")} · ${state.students.length} student record${state.students.length===1?"":"s"}</div>
          </div>
        </div>
        <div class="no-print" style="display:flex; gap:10px;">
          <button class="btn btn-primary" id="btnAddStudent">${ICONS.plus} New Admission</button>
        </div>
      </div>
      <div class="content" id="content"></div>
    </div>
  `;
  document.querySelectorAll("[data-nav]").forEach(el=>{
    el.addEventListener("click", ()=>{ state.view = el.dataset.nav; state.sidebarOpen=false; render(); });
  });
  document.getElementById("btnAddStudent").addEventListener("click", ()=> openStudentForm(null));
  const signOutLink = document.getElementById("signOutLink");
  if(signOutLink) signOutLink.addEventListener("click", (e)=>{ e.preventDefault(); auth.signOut(); });
  const menuBtn = document.getElementById("menuBtn");
  if(menuBtn) menuBtn.addEventListener("click", ()=>{ state.sidebarOpen = !state.sidebarOpen; render(); });

  const content = document.getElementById("content");
  if(state.view==="dashboard") content.innerHTML = renderDashboard();
  else if(state.view==="students") content.innerHTML = renderStudents();
  else if(state.view==="admissions") content.innerHTML = renderAdmissions();
  else if(state.view==="fees") content.innerHTML = renderFees();
  else if(state.view==="reports") content.innerHTML = renderReports();

  attachContentHandlers();
}

/* =========================================================
   DASHBOARD
   ========================================================= */
function renderDashboard(){
  const list = state.students;
  const totalStudents = list.length;
  const totalFee = list.reduce((a,s)=>a+Number(s.totalFee||0),0);
  const totalCollected = list.reduce((a,s)=>a+computeDerived(s).paid,0);
  const totalDue = list.reduce((a,s)=>a+computeDerived(s).due,0);
  const newToday = list.filter(s=>isToday(s.admissionDate)).length;

  const recentPayments = [];
  list.forEach(s=>{
    (s.payments||[]).forEach(p=> recentPayments.push({...p, studentName:s.name, studentId:s.id}));
  });
  recentPayments.sort((a,b)=> new Date(b.date)-new Date(a.date));
  const recent = recentPayments.slice(0,6);

  const byGroup = {};
  list.forEach(s=>{
    const key = `${s.class}__${streamsLabel(s)}`;
    if(!byGroup[key]) byGroup[key] = {class:s.class, label:streamsLabel(s), count:0, fee:0, collected:0};
    byGroup[key].count++;
    byGroup[key].fee += Number(s.totalFee||0);
    byGroup[key].collected += computeDerived(s).paid;
  });
  const groupRows = Object.values(byGroup).sort((a,b)=> a.class.localeCompare(b.class) || a.label.localeCompare(b.label));

  return `
  <div class="grid-stats">
    <div class="stat-card"><div class="label">Total Students</div><div class="value">${totalStudents}</div></div>
    <div class="stat-card accent-navy"><div class="label">Today's Admissions</div><div class="value">${newToday}</div></div>
    <div class="stat-card"><div class="label">Total Course Fee</div><div class="value">${fmtMoney(totalFee)}</div></div>
    <div class="stat-card accent-success"><div class="label">Total Collected</div><div class="value">${fmtMoney(totalCollected)}</div></div>
    <div class="stat-card accent-danger"><div class="label">Total Pending / Due</div><div class="value">${fmtMoney(totalDue)}</div></div>
  </div>

  <div class="panel">
    <div class="panel-head"><h3>Class &amp; Stream Overview</h3></div>
    <table>
      <thead><tr><th>Class</th><th>Stream(s)</th><th>Students</th><th>Course Fee</th><th>Collected</th><th>Due</th></tr></thead>
      <tbody>
        ${groupRows.length ? groupRows.map(g=>{
          const due = g.fee - g.collected;
          return `<tr>
            <td>Class ${g.class}</td>
            <td><span class="tag">${g.label}</span></td>
            <td>${g.count}</td>
            <td>${fmtMoney(g.fee)}</td>
            <td>${fmtMoney(g.collected)}</td>
            <td>${fmtMoney(due)}</td>
          </tr>`;
        }).join("") : `<tr class="empty-row"><td colspan="6">No students yet.</td></tr>`}
      </tbody>
    </table>
  </div>

  <div class="panel">
    <div class="panel-head"><h3>Recent Payments</h3></div>
    <table>
      <thead><tr><th>Student</th><th>Admission ID</th><th>Date</th><th>Amount</th></tr></thead>
      <tbody>
        ${recent.length ? recent.map(p=>`
          <tr>
            <td class="cell-strong">${escapeHtml(p.studentName)}</td>
            <td class="cell-muted">${p.studentId}</td>
            <td>${fmtDate(p.date)}</td>
            <td>${fmtMoney(p.amount)}</td>
          </tr>`).join("") : `<tr class="empty-row"><td colspan="4">No payments recorded yet.</td></tr>`}
      </tbody>
    </table>
  </div>
  `;
}

function statusBadge(status){
  if(status==="paid") return `<span class="badge badge-paid"><span class="badge-dot"></span>Paid</span>`;
  if(status==="partial") return `<span class="badge badge-partial"><span class="badge-dot"></span>Partial</span>`;
  return `<span class="badge badge-due"><span class="badge-dot"></span>Due</span>`;
}

  const list = filteredStudents();

/* =========================================================
   REPORTS VIEW
   ========================================================= */
function renderReports(){
  const tabs = [
    ["yearwise","Batch / Year-wise"],
    ["classwise","Class-wise Students"],
    ["streamwise","Stream-wise Students"],
    ["collection","Class-wise Collection"],
    ["pending","Pending Fees"],
    ["payments","Payment History"],
    ["admissions","Admission History"],
  ];
  let body = "";
  const list = state.students;

  if(state.reportTab==="yearwise"){
    const years = availableYears();
    body = years.length ? years.map(y=>{
      const rows = list.filter(s=>admissionYear(s)===y);
      const fee = rows.reduce((a,s)=>a+Number(s.totalFee||0),0);
      const collected = rows.reduce((a,s)=>a+computeDerived(s).paid,0);
      return `<div class="panel">
        <div class="panel-head"><h3>Admission Batch ${y} (${rows.length} student${rows.length===1?"":"s"})</h3></div>
        <div class="kv-grid" style="margin-top:0;">
          <div class="kv"><div class="k">Total Fee</div><div class="v">${fmtMoney(fee)}</div></div>
          <div class="kv"><div class="k">Collected</div><div class="v">${fmtMoney(collected)}</div></div>
          <div class="kv"><div class="k">Due</div><div class="v">${fmtMoney(fee-collected)}</div></div>
        </div>
        <table><thead><tr><th>Admission ID</th><th>Name</th><th>Class</th><th>Stream</th><th>Admission Date</th></tr></thead>
        <tbody>${rows.map(s=>`<tr><td class="cell-muted">${s.id}</td><td class="cell-strong">${escapeHtml(s.name)}</td><td>Class ${s.class}</td><td><span class="tag">${streamsLabel(s)}</span></td><td>${fmtDate(s.admissionDate)}</td></tr>`).join("")}</tbody></table>
      </div>`;
    }).join("") : `<div class="panel"><div class="empty-row" style="padding:20px;">No admissions recorded yet.</div></div>`;
  }
  else if(state.reportTab==="classwise"){
    body = CLASSES.map(c=>{
      const rows = list.filter(s=>s.class===c);
      return `<div class="panel">
        <div class="panel-head"><h3>Class ${c} (${rows.length})</h3></div>
        <table><thead><tr><th>Admission ID</th><th>Name</th><th>Stream</th><th>Mobile</th><th>Fee</th><th>Due</th></tr></thead>
        <tbody>${rows.length? rows.map(s=>{const d=computeDerived(s); return `<tr><td class="cell-muted">${s.id}</td><td class="cell-strong">${escapeHtml(s.name)}</td><td><span class="tag">${streamsLabel(s)}</span></td><td>${escapeHtml(s.mobile)}</td><td>${fmtMoney(s.totalFee)}</td><td>${fmtMoney(d.due)}</td></tr>`;}).join("") : `<tr class="empty-row"><td colspan="6">No students in this class.</td></tr>`}</tbody></table>
      </div>`;
    }).join("");
  }
  else if(state.reportTab==="streamwise"){
    body = STREAMS.map(st=>{
      const rows = list.filter(s=>getStreams(s).includes(st));
      return `<div class="panel">
        <div class="panel-head"><h3>${st} Stream (${rows.length})</h3></div>
        <table><thead><tr><th>Admission ID</th><th>Name</th><th>Class</th><th>Mobile</th><th>Fee</th><th>Due</th></tr></thead>
        <tbody>${rows.length? rows.map(s=>{const d=computeDerived(s); return `<tr><td class="cell-muted">${s.id}</td><td class="cell-strong">${escapeHtml(s.name)}</td><td>Class ${s.class}</td><td>${escapeHtml(s.mobile)}</td><td>${fmtMoney(s.totalFee)}</td><td>${fmtMoney(d.due)}</td></tr>`;}).join("") : `<tr class="empty-row"><td colspan="6">No students in this stream.</td></tr>`}</tbody></table>
      </div>`;
    }).join("");
  }
  else if(state.reportTab==="collection"){
    const byGroup = {};
    list.forEach(s=>{
      const key = `${s.class}__${streamsLabel(s)}`;
      if(!byGroup[key]) byGroup[key] = {c:s.class, st:streamsLabel(s), count:0, fee:0, collected:0};
      byGroup[key].count++;
      byGroup[key].fee += Number(s.totalFee||0);
      byGroup[key].collected += computeDerived(s).paid;
    });
    const rows = Object.values(byGroup).sort((a,b)=> a.c.localeCompare(b.c) || a.st.localeCompare(b.st));
    body = `<div class="panel"><div class="panel-head"><h3>Class-wise Fee Collection</h3></div>
      <div class="hint" style="margin-bottom:10px;">Merged-stream students (e.g. English + Hindi) are counted once, under their combined group — so totals below never double-count a fee.</div>
      <table><thead><tr><th>Class</th><th>Stream(s)</th><th>Students</th><th>Total Fee</th><th>Collected</th><th>Due</th></tr></thead>
      <tbody>${rows.length? rows.map(r=>`<tr><td>Class ${r.c}</td><td><span class="tag">${r.st}</span></td><td>${r.count}</td><td>${fmtMoney(r.fee)}</td><td>${fmtMoney(r.collected)}</td><td>${fmtMoney(r.fee-r.collected)}</td></tr>`).join("") : `<tr class="empty-row"><td colspan="6">No students yet.</td></tr>`}</tbody></table>
    </div>`;
  }
  else if(state.reportTab==="pending"){
    const rows = list.filter(s=>computeDerived(s).due>0).sort((a,b)=>computeDerived(b).due-computeDerived(a).due);
    body = `<div class="panel"><div class="panel-head"><h3>Pending Fee List (${rows.length})</h3></div>
      <table><thead><tr><th>Admission ID</th><th>Name</th><th>Class/Stream</th><th>Mobile</th><th>Fee</th><th>Paid</th><th>Due</th><th class="no-print">Action</th></tr></thead>
      <tbody>${rows.length? rows.map(s=>{const d=computeDerived(s); return `<tr><td class="cell-muted">${s.id}</td><td class="cell-strong">${escapeHtml(s.name)}</td><td>Class ${s.class} · ${streamsLabel(s)}</td><td>${escapeHtml(s.mobile)}</td><td>${fmtMoney(s.totalFee)}</td><td>${fmtMoney(d.paid)}</td><td>${fmtMoney(d.due)}</td><td class="no-print"><button class="btn btn-ghost btn-sm" data-remind="${s.id}" ${!(s.guardianWhatsapp||s.guardianMobile)?"disabled":""} title="${(s.guardianWhatsapp||s.guardianMobile)? "":"Add guardian's WhatsApp number first"}">Remind</button></td></tr>`;}).join("") : `<tr class="empty-row"><td colspan="8">No pending dues. All fees collected.</td></tr>`}</tbody></table>
    </div>`;
  }
  else if(state.reportTab==="payments"){
    const rows = [];
    list.forEach(s=>(s.payments||[]).forEach(p=>rows.push({...p, name:s.name, id:s.id})));
    rows.sort((a,b)=>new Date(b.date)-new Date(a.date));
    body = `<div class="panel"><div class="panel-head"><h3>Payment History (${rows.length})</h3></div>
      <table><thead><tr><th>Admission ID</th><th>Name</th><th>Date</th><th>Amount</th></tr></thead>
      <tbody>${rows.length? rows.map(r=>`<tr><td class="cell-muted">${r.id}</td><td class="cell-strong">${escapeHtml(r.name)}</td><td>${fmtDate(r.date)}</td><td>${fmtMoney(r.amount)}</td></tr>`).join("") : `<tr class="empty-row"><td colspan="4">No payments recorded yet.</td></tr>`}</tbody></table>
    </div>`;
  }
  else if(state.reportTab==="admissions"){
    const rows = list.slice().sort((a,b)=>new Date(b.admissionDate)-new Date(a.admissionDate));
    body = `<div class="panel"><div class="panel-head"><h3>Admission History (${rows.length})</h3></div>
      <table><thead><tr><th>Admission ID</th><th>Name</th><th>Class/Stream</th><th>Admission Date</th></tr></thead>
      <tbody>${rows.length? rows.map(s=>`<tr><td class="cell-muted">${s.id}</td><td class="cell-strong">${escapeHtml(s.name)}</td><td>Class ${s.class} · ${streamsLabel(s)}</td><td>${fmtDate(s.admissionDate)}</td></tr>`).join("") : `<tr class="empty-row"><td colspan="4">No admissions yet.</td></tr>`}</tbody></table>
    </div>`;
  }

  return `
  <div class="panel no-print">
    <div class="filters-row" style="justify-content:space-between;">
      <div class="filters-row" style="flex-wrap:wrap;">
        ${tabs.map(([id,label])=>`<button class="btn ${state.reportTab===id?'btn-primary':'btn-ghost'} btn-sm" data-report-tab="${id}">${label}</button>`).join("")}
      </div>
      <button class="btn btn-ghost btn-sm" id="btnPrint">Print report</button>
    </div>
  </div>
  ${body}
  `;
}

/* =========================================================
   CONTENT INTERACTION HANDLERS
   ========================================================= */
function attachContentHandlers(){
  const searchInput = document.getElementById("searchInput");
  if(searchInput){
    searchInput.addEventListener("input", (e)=>{ state.search = e.target.value; syncListOnly(); });
  }
  const fc = document.getElementById("filterClass");
  if(fc) fc.addEventListener("change", e=>{ state.filterClass = e.target.value; render(); });
  const fs = document.getElementById("filterStream");
  if(fs) fs.addEventListener("change", e=>{ state.filterStream = e.target.value; render(); });
  const fy = document.getElementById("filterYear");
  if(fy) fy.addEventListener("change", e=>{ state.filterYear = e.target.value; render(); });

  document.querySelectorAll("[data-view]").forEach(el=>{
    el.addEventListener("click", ()=> openProfile(el.dataset.view));
  });
  document.querySelectorAll("[data-edit]").forEach(el=>{
    el.addEventListener("click", ()=> openStudentForm(el.dataset.edit));
  });
  document.querySelectorAll("[data-delete]").forEach(el=>{
    el.addEventListener("click", ()=> confirmDelete(el.dataset.delete));
  });
  document.querySelectorAll("[data-pay]").forEach(el=>{
    el.addEventListener("click", ()=> openPaymentForm(el.dataset.pay));
  });
  document.querySelectorAll("[data-remind]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const st = state.students.find(x=>x.id===el.dataset.remind);
      if(!st) return;
      window.open(buildReminderLink(st), "_blank");
    });
  });
  const quickAdmit = document.getElementById("btnQuickAdmit");
  if(quickAdmit) quickAdmit.addEventListener("click", ()=> openStudentForm(null));

  document.querySelectorAll("[data-report-tab]").forEach(el=>{
    el.addEventListener("click", ()=>{ state.reportTab = el.dataset.reportTab; render(); });
  });
  const printBtn = document.getElementById("btnPrint");
  if(printBtn) printBtn.addEventListener("click", ()=> window.print());
}

// re-render only the list-bearing content without losing input focus while typing search
function syncListOnly(){
  const content = document.getElementById("content");
  if(state.view==="students") content.innerHTML = renderStudents();
  else if(state.view==="fees") content.innerHTML = renderFees();
  attachContentHandlers();
  const s = document.getElementById("searchInput");
  if(s){ s.focus(); s.value = state.search; s.setSelectionRange(s.value.length, s.value.length); }
}

/* =========================================================
   MODALS: overlay helper
   ========================================================= */
function openOverlay(html){
  const wrap = document.createElement("div");
  wrap.className = "overlay";
  wrap.id = "overlayRoot";
  wrap.innerHTML = html;
  document.body.appendChild(wrap);
  wrap.addEventListener("mousedown", (e)=>{ if(e.target===wrap) closeOverlay(); });
  return wrap;
}
function closeOverlay(){
  const el = document.getElementById("overlayRoot");
  if(el) el.remove();
}

function openPaymentForm(studentId){
  const s = state.students.find(x=>x.id===studentId);
  if(!s) return;
  const d = computeDerived(s);
  const html = `
  <div class="modal">
    <div class="modal-head">

      <button class="modal-close" id="closeModal">&times;</button>
    </div>

    <form id="paymentForm">
      <div class="form-grid">
        <div class="field">
          <label>Payment Date *</label>
          <input class="input" type="date" name="date" value="${todayStr()}" required/>
        </div>
        <div class="field">
          <label>Amount (₹) *</label>
          <input class="input" type="number" min="1" step="1" name="amount" placeholder="Amount received" required/>
          <div class="err" data-err="amount"></div>
        </div>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-ghost" id="cancelModal">Cancel</button>
        <button type="submit" class="btn btn-primary">Record Payment</button>
      </div>
    </form>
  </div>`;
  openOverlay(html);
  document.getElementById("closeModal").addEventListener("click", closeOverlay);
  document.getElementById("cancelModal").addEventListener("click", closeOverlay);
  document.getElementById("paymentForm").addEventListener("submit", (e)=>{
    e.preventDefault();
    const f = new FormData(e.target);
    const data = Object.fromEntries(f.entries());
    const amt = Number(data.amount);
    const errEl = document.querySelector('[data-err="amount"]');
    if(!amt || amt<=0){ errEl.textContent = "Enter a valid amount."; return; }
    if(amt > d.due){ errEl.textContent = `Amount exceeds due balance of ${fmtMoney(d.due)}.`; return; }
    const newPayments = [...(s.payments||[]), {date:data.date, amount:amt}];
    updateStudentDoc(s.id, { payments: newPayments });
    showToast("Payment recorded.");
    closeOverlay();
  });
}

  wrap.innerHTML = `

      <img src="${LOGO_SRC}" alt="logo"/>

        <input class="input" type="password" id="lockInput" placeholder="Password" autocomplete="current-password" />
        <div class="lock-err" id="lockErr"></div>
        <button type="submit" class="btn btn-primary">Sign in</button>
      </form>
      <div class="hint" style="margin-top:12px;">Access is managed in Firebase Authentication — ask the admin to add your email if you can't sign in.</div>
    </div>

  document.body.appendChild(wrap);
  const emailInput = document.getElementById("lockEmail");
  emailInput.focus();
  document.getElementById("lockForm").addEventListener("submit", (e)=>{
    e.preventDefault();
    const errEl = document.getElementById("lockErr");
    errEl.textContent = "";
    const email = emailInput.value.trim();
    const password = document.getElementById("lockInput").value;

  });
}

/* =========================================================
   INIT — Firebase Authentication gate, then live Firestore sync
   ========================================================= */
auth.onAuthStateChanged((user)=>{
  state.authChecked = true;
  if(user){
    hideLockScreen();
    render();
    attachStudentsListener();
  } else {
    if(unsubscribeStudents){ unsubscribeStudents(); unsubscribeStudents = null; }
    state.students = [];
    state.loaded = false;
    const appEl = document.getElementById("app");
    if(appEl) appEl.innerHTML = "";
    showLockScreen();
  }
});
</script>
</body>
</html>
